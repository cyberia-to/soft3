name: Diagnostic simulation lock (C4a)

# Measurement only, never merged, never a release gate (plan row C4a).
# Rehearsal 41354213746 (soft3 6edafa6 = #615) stack leg: simulation-gate exit 101 in 0.27 s,
# `cannot update the lock file .../simulation/Cargo.lock because --locked was passed`.
# simulation at the stand's 218f063 (simulation#3, the hickory lock) records soft3 0.10.0 with
# the node inline; soft3 release/phase1 95c3790 is 0.11.0 with cybernode 2f4c5ee by path.
# This job lays 41354213746's stand with soft3=95c3790, re-resolves simulation's lock from its
# committed one (cargo keeps every entry it can; only what the manifests force changes), and
# runs the train's simulation-gate command with --locked. If the committed lock already
# resolves (the refreshed simulation#2 head, via SIM below), it only runs the gate.
on:
  push:
    branches: ['diag/simulation-lock-c4a*']

permissions:
  contents: read

env:
  SIM: c312ab9e8eb7fea5dd1687f247c744e47b26c8eb
  # simulation#2's refreshed head: its committed lock must resolve as is
  STRICT: '1'

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Snapshot the stand and lay out the checkouts like the train
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 release/train.py snapshot --manager . --component soft3 --candidate candidate-20261101.90 --output "$RUNNER_TEMP/snapshot" \
            --override soft3=95c3790565b7e7a5e103197004fcfbca0e791bd4 \
            --override cybernode=2f4c5eedf5dfd58c90f76c78d0387b202f250048 --override simulation=$SIM \
            --override bbg=2d7873c739bb799f6c9a48c566c941df39de79d8 --override cybergraph=fe115b331c2fa9c83ccf00cc540814721a6d9470 \
            --override file=4957848ac4124107b8349811a71b53d4c52479fa --override foculus=5579d3162505af5aabe479c991d36c8093322096 \
            --override hemera=8559b52f480ebb6fdd0a25dec16ba27747da9cab --override lens=d6dcc3f2ad2186466d639518f71cecf6fb928d96 \
            --override mudra=33f8029d4dd9cdbe56c54737a1d3a6b453407d53 --override nox=41ba24f275950c22c46206c5fa73fcdb82dc44ec \
            --override radio=b74133ce67a67e4495c824d829b571b564ab0c11 --override rune=3b031ff0d90ee17538718093c38846707bf70ef9 \
            --override tok=2b3bdceebe6e06d718280c03fe48f92707fecac2 --override tru=464104cf69ccce2ef8cae13c4b1911fba54ff7d3 \
            --override vault=503d8c806f74dcafd4a174214080dcd09e6bde35 --override zheng=166a14e62166218161afa555efa166afacc7a120
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "release")
          from train_sources import materialize
          temp = Path(os.environ["RUNNER_TEMP"])
          sources = json.loads((temp / "snapshot/sources.json").read_text())
          for row in sources["repositories"]:
              if row.get("override"):
                  print(row["name"], row.get("revision"), row.get("available"), row.get("error"))
          result = materialize(sources, temp / "sources")
          print("materialized", len(result), "red:", [r for r in result if r["result"] != "green"])
          PY
          mkdir -p "$RUNNER_TEMP/out"
          for r in soft3 cybernode simulation; do echo "$r $(git -C "$RUNNER_TEMP/sources/$r" rev-parse HEAD)"; done | tee "$RUNNER_TEMP/out/revs.txt"
          test "$(git -C "$RUNNER_TEMP/sources/simulation" rev-parse HEAD)" = "$SIM"
      - name: Resolve simulation's lock against soft3 0.11 + cybernode (from the committed lock)
        working-directory: ${{ runner.temp }}/sources/simulation
        run: |
          set -o pipefail
          cp Cargo.lock "$RUNNER_TEMP/out/Cargo.lock.before"
          if cargo metadata --locked --format-version 1 >/dev/null 2>"$RUNNER_TEMP/out/locked-before.txt"; then
            echo "committed lock already resolves --locked" | tee "$RUNNER_TEMP/out/lock-verdict.txt"
          else
            cat "$RUNNER_TEMP/out/locked-before.txt"
            if [ "$STRICT" = 1 ]; then echo "STRICT: committed lock does not resolve --locked" | tee "$RUNNER_TEMP/out/lock-verdict.txt"; exit 1; fi
            cargo metadata --format-version 1 >/dev/null
            echo "lock re-resolved" | tee "$RUNNER_TEMP/out/lock-verdict.txt"
          fi
          cp Cargo.lock "$RUNNER_TEMP/out/Cargo.lock"
          sha256sum Cargo.lock | tee "$RUNNER_TEMP/out/simulation-lock.sha256"
          diff -u "$RUNNER_TEMP/out/Cargo.lock.before" Cargo.lock > "$RUNNER_TEMP/out/simulation-lock.diff" || true
          grep -E '^[-+](name|version) ' "$RUNNER_TEMP/out/simulation-lock.diff" | head -120 || true
          cargo metadata --locked --format-version 1 >/dev/null && echo "simulation: lock resolves --locked"
      - name: simulation-gate (the train's command)
        id: sim
        continue-on-error: true
        working-directory: ${{ runner.temp }}/sources/simulation
        run: |
          set -o pipefail
          timeout 3600 cargo run --locked --quiet --profile sim -p simulation-chain -- gate \
            --out "$RUNNER_TEMP/out/simulation" --md "$RUNNER_TEMP/out/simulation-gate.md" --budget 1500 \
            2>&1 | tee "$RUNNER_TEMP/out/simulation-gate.log"
      - name: Summary
        if: always()
        run: |
          echo "simulation-gate: ${{ steps.sim.outcome }}"
          cat "$RUNNER_TEMP/out/lock-verdict.txt" || true
          tail -40 "$RUNNER_TEMP/out/simulation-gate.log" || true
          cat "$RUNNER_TEMP/out/simulation-gate.md" || true
          echo "warnings:"; grep -h "^warning" "$RUNNER_TEMP"/out/*.log | sort | uniq -c || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: simulation-lock-c4a
          path: |
            ${{ runner.temp }}/out/
            ${{ runner.temp }}/snapshot/sources.json
          if-no-files-found: warn
      - name: Fail when red
        if: steps.sim.outcome == 'failure'
        run: exit 1
