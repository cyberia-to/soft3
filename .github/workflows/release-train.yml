name: Release train
on:
  schedule:            # daily at 12:00 UTC (the owner, 2026-10-24); was fridays
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      candidate:
        description: 'candidate-YYYYMMDD.N (empty selects today .1)'
        default: ''
        type: string
      cut:
        description: 'Create a draft candidate after recording all gates'
        default: true
        type: boolean
permissions:
  contents: write
concurrency:
  group: release-train
  cancel-in-progress: false
jobs:
  candidate:
    uses: ./.github/workflows/candidate.yml
    with:
      component: soft3
      manager_ref: ${{ github.sha }}
      candidate: ${{ inputs.candidate || '' }}
      cut: ${{ github.event_name == 'schedule' || inputs.cut == true }}
