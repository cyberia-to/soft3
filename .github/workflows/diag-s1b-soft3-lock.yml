name: Diagnostic s1b soft3 lock

# Measurement only, never merged, never a release gate.
# radio#50 (fix/s1b-hickory-0.26, 9c498b2) moves cyber-radio / cyber-radio-relay /
# iroh-dns-server to hickory 0.26.3. soft3 takes radio and iroh-gossip by path
# (crate/Cargo.toml:63-64), so soft3's crate/Cargo.lock (hickory 0.25.2) must be
# re-resolved on the build service against that tree (the director's host has no cargo).
# The stand is rehearsal 40656164861's overrides by SHA with only radio replaced,
# and soft3 = this branch. The job resolves the soft3 crate lock, lists the hickory
# versions it ends up with, and runs the gate commands with the resolved lock.
on:
  push:
    branches: ['diag/s1b-soft3-lock*']

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Snapshot the stand and lay out the checkouts like the train
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 release/train.py snapshot --manager . --component soft3 --candidate candidate-20261028.91 --output "$RUNNER_TEMP/snapshot" \
            --override soft3=diag/s1b-soft3-lock \
            --override bbg=2d7873c739bb799f6c9a48c566c941df39de79d8 --override cybergraph=fe115b331c2fa9c83ccf00cc540814721a6d9470 \
            --override file=4957848ac4124107b8349811a71b53d4c52479fa --override foculus=0551e3b9c19a1c6a69c8d552ffbbfd3fa1c71c5d \
            --override hemera=8559b52f480ebb6fdd0a25dec16ba27747da9cab --override lens=fee68d8dec06a67b70f23c0328e4b7fbc1bb0303 \
            --override mudra=33f8029d4dd9cdbe56c54737a1d3a6b453407d53 --override nox=41ba24f275950c22c46206c5fa73fcdb82dc44ec \
            --override radio=9c498b2ccbe11bdd7b824e11e8f63003af20e8e1 --override rune=3b031ff0d90ee17538718093c38846707bf70ef9 \
            --override tok=2b3bdceebe6e06d718280c03fe48f92707fecac2 --override tru=464104cf69ccce2ef8cae13c4b1911fba54ff7d3 \
            --override vault=503d8c806f74dcafd4a174214080dcd09e6bde35 --override zheng=166a14e62166218161afa555efa166afacc7a120
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "release")
          from train_sources import materialize
          temp = Path(os.environ["RUNNER_TEMP"])
          sources = json.loads((temp / "snapshot/sources.json").read_text())
          for row in sources["repositories"]:
              if row.get("override") or row["name"] in ("soft3", "radio"):
                  print(row["name"], row.get("revision"), row.get("override"), row.get("available"), row.get("error"))
          result = materialize(sources, temp / "sources")
          print("materialized", len(result), "red:", [r for r in result if r["result"] != "green"])
          PY
          mkdir -p "$RUNNER_TEMP/out"
      - name: Resolve the soft3 crate lock (resolution only)
        working-directory: ${{ runner.temp }}/sources
        run: |
          git -C soft3 rev-parse HEAD
          git -C radio rev-parse HEAD
          M=soft3/crate/Cargo.toml
          sha256sum soft3/crate/Cargo.lock | tee "$RUNNER_TEMP/out/soft3-lock-before.sha256"
          cargo metadata --locked --format-version 1 --manifest-path $M >/dev/null 2>"$RUNNER_TEMP/out/locked-before.txt" && echo "soft3: lock already matches" || { echo "soft3: lock stale, resolving"; tail -5 "$RUNNER_TEMP/out/locked-before.txt"; }
          cargo metadata --format-version 1 --manifest-path $M >/dev/null 2>"$RUNNER_TEMP/out/resolve.txt" || { echo "soft3: does not resolve"; cat "$RUNNER_TEMP/out/resolve.txt"; exit 1; }
          cargo metadata --locked --format-version 1 --manifest-path $M >/dev/null && echo "soft3: resolved"
          cp soft3/crate/Cargo.lock "$RUNNER_TEMP/out/soft3.Cargo.lock"
          sha256sum soft3/crate/Cargo.lock | tee "$RUNNER_TEMP/out/soft3-lock-after.sha256"
          git -C soft3 diff -- crate/Cargo.lock > "$RUNNER_TEMP/out/soft3-Cargo.lock.diff"
          git -C soft3 diff --stat -- crate/Cargo.lock | tail -1
          grep -E '^[-+]name = ' "$RUNNER_TEMP/out/soft3-Cargo.lock.diff" | sort | uniq -c || true
          {
            echo "== hickory packages in soft3/crate/Cargo.lock =="
            grep -A1 '^name = "hickory' soft3/crate/Cargo.lock || true
            echo "== cargo tree -i hickory-proto@0.25.2 =="
            cargo tree --locked --manifest-path $M -i hickory-proto@0.25.2 2>&1 || true
          } 2>&1 | tee -a "$RUNNER_TEMP/out/resolve.txt" "$RUNNER_TEMP/out/hickory.txt"
      - name: soft3-tests (cargo test --locked)
        id: test
        continue-on-error: true
        working-directory: ${{ runner.temp }}/sources/soft3/crate
        run: |
          set -o pipefail
          timeout 3600 cargo test --locked --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/out/test-soft3.log"
      - name: soft3-release (cargo build --release --locked)
        id: release
        continue-on-error: true
        working-directory: ${{ runner.temp }}/sources/soft3/crate
        run: |
          set -o pipefail
          timeout 3600 cargo build --release --locked 2>&1 | tee "$RUNNER_TEMP/out/release-soft3.log"
          ./target/release/soft3 --version 2>&1 | tee -a "$RUNNER_TEMP/out/release-soft3.log" || true
      - name: Summary
        if: always()
        run: |
          echo "test: ${{ steps.test.outcome }}  release: ${{ steps.release.outcome }}"
          grep -h "^error\|^test result\|FAILED\|panicked\|^ *--> " "$RUNNER_TEMP"/out/*-soft3.log | head -100 || true
          echo "warnings:"
          grep -h "^warning" "$RUNNER_TEMP"/out/*-soft3.log | sort | uniq -c || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: s1b-soft3-lock
          path: |
            ${{ runner.temp }}/out/
            ${{ runner.temp }}/snapshot/sources.json
          if-no-files-found: warn
      - name: Fail when red
        if: steps.test.outcome == 'failure' || steps.release.outcome == 'failure'
        run: exit 1
