name: Diagnostic g16 auto probe

# Measurement only, never merged, never a release gate (plan row G16, session 102).
# Diagnostic 40407469682 (macos-15-intel): `soft3 mine bench --backend webgpu` and
# `--backend auto` time out at 600 s on "Apple Paravirtual device (Metal)", and
# tests/mine_e2e.rs (Choice::Auto) stalls on its first template; macos-14 control fine.
# Fix under test (fix/g16-auto-probe): Auto keeps WebGPU only if a bounded probe at
# the backend's own dispatch size answers the CPU's index at a higher rate.
# Same stand as 40389629921 / 40407469682, pinned by SHA; soft3 crate = this head.
# bounded.py now kills the whole process group (40407469682's killed cargo only,
# and the orphaned test binary held tee open until cancel).
# Session 104: diagnostic 40416397867 on macos-15-intel: Auto refused the adapter
# and mine_e2e passed (54.5 s), but the later `cargo test --locked` failed
# lib `every_backend_agrees_and_verifies` (webgpu base 0xe4070: Some(0) vs Some(636)),
# a test #353 does not touch, which passed on this leg in 40389629921 where lib ran
# first. Hypothesis: the probe's abandoned 2^22 dispatch from the earlier mine_e2e
# process leaves the paravirtual GPU answering wrong. Two Intel jobs on head 2ad86ab:
# `gate` (no stall before the gate command, the train's order) and `stall-first`.
on:
  push:
    branches: ['diag/g16-auto-*']

permissions:
  contents: read

jobs:
  mine:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel]
        order: [gate, stall-first]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustc -vV
      - name: Snapshot the stand of 40389629921 and lay out the checkouts like the train
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 release/train.py snapshot --manager . --component soft3 --candidate candidate-20261026.1 --output "$RUNNER_TEMP/snapshot" \
            --override bbg=2d7873c739bb799f6c9a48c566c941df39de79d8 --override cybergraph=fe115b331c2fa9c83ccf00cc540814721a6d9470 \
            --override file=4957848ac4124107b8349811a71b53d4c52479fa --override foculus=0551e3b9c19a1c6a69c8d552ffbbfd3fa1c71c5d \
            --override hemera=8559b52f480ebb6fdd0a25dec16ba27747da9cab --override lens=fee68d8dec06a67b70f23c0328e4b7fbc1bb0303 \
            --override mudra=33f8029d4dd9cdbe56c54737a1d3a6b453407d53 --override nox=41ba24f275950c22c46206c5fa73fcdb82dc44ec \
            --override radio=7452833d1877151c7bc8343e921621e2af90eb8c --override rune=3b031ff0d90ee17538718093c38846707bf70ef9 \
            --override tok=2b3bdceebe6e06d718280c03fe48f92707fecac2 --override tru=464104cf69ccce2ef8cae13c4b1911fba54ff7d3 \
            --override vault=503d8c806f74dcafd4a174214080dcd09e6bde35 --override zheng=166a14e62166218161afa555efa166afacc7a120
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "release")
          from train_sources import materialize
          temp = Path(os.environ["RUNNER_TEMP"])
          sources = json.loads((temp / "snapshot/sources.json").read_text())
          for row in sources["repositories"]:
              if row.get("override") or row["name"] in ("soft3", "honeycrisp"):
                  print(row["name"], row["revision"], row.get("override"))
          result = materialize(sources, temp / "sources")
          print("materialized", len(result), "red:", [r for r in result if r["result"] != "green"])
          PY
          rm -rf "$RUNNER_TEMP/sources/soft3/crate"
          cp -a crate "$RUNNER_TEMP/sources/soft3/crate"
          echo "soft3 crate from $GITHUB_SHA"
          # macOS runners have no timeout(1)
          cat > "$RUNNER_TEMP/bounded.py" <<'PY'
          import os, signal, subprocess, sys, time
          limit = float(sys.argv[1]); cmd = sys.argv[2:]
          t = time.monotonic()
          try:
              p = subprocess.Popen(cmd, start_new_session=True)
              code = p.wait(timeout=limit)
          except subprocess.TimeoutExpired:
              os.killpg(p.pid, signal.SIGKILL)
              p.wait()
              code = "timeout"
          print(f"== {' '.join(cmd)}: exit {code} after {time.monotonic() - t:.1f} s (limit {limit:.0f} s)", flush=True)
          PY
      - name: "cargo build --locked and cargo test --no-run (the soft3-tests profile)"
        working-directory: ${{ runner.temp }}/sources/soft3/crate
        run: |
          set -o pipefail
          cargo build --locked 2>&1 | tail -3
          cargo test --locked --test mine_e2e --no-run 2>&1 | tail -3
      - name: tests/mine_e2e.rs alone, --nocapture (stall-first only)
        if: matrix.order == 'stall-first'
        working-directory: ${{ runner.temp }}/sources/soft3/crate
        run: |
          python3 "$RUNNER_TEMP/bounded.py" 600 cargo test --locked --test mine_e2e -- --nocapture 2>&1 | tee "$RUNNER_TEMP/mine_e2e.log"
      - name: every_backend_agrees_and_verifies alone, five times
        working-directory: ${{ runner.temp }}/sources/soft3/crate
        run: |
          for i in 1 2 3 4 5; do
            echo "== round $i" | tee -a "$RUNNER_TEMP/agree.log"
            python3 "$RUNNER_TEMP/bounded.py" 900 cargo test --locked --lib chain::mine::tests::every_backend_agrees_and_verifies 2>&1 | tee -a "$RUNNER_TEMP/agree.log" || true
          done
          grep -E '^== |^test result|left:|right:' "$RUNNER_TEMP/agree.log" || true
      - name: the soft3-tests command, cargo test --locked (gate limit 1800 s)
        working-directory: ${{ runner.temp }}/sources/soft3/crate
        run: |
          python3 "$RUNNER_TEMP/bounded.py" 1800 cargo test --locked 2>&1 | tee "$RUNNER_TEMP/soft3-tests.log"
          echo "warnings: $(grep -c '^warning' "$RUNNER_TEMP/soft3-tests.log")" | tee -a "$RUNNER_TEMP/soft3-tests.log"
          grep -E '^test result|FAILED|panicked' "$RUNNER_TEMP/soft3-tests.log" | tail -40
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: g16-auto-${{ matrix.runner }}-${{ matrix.order }}
          path: |
            ${{ runner.temp }}/soft3-tests.log
            ${{ runner.temp }}/mine_e2e.log
            ${{ runner.temp }}/agree.log
            ${{ runner.temp }}/snapshot/sources.json
          if-no-files-found: warn
