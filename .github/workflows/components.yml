name: Components registry
on:
  pull_request:
    paths: ["release/components.toml", "release/phase1.toml", "site/**", "status.md"]
  push:
    branches: [main]
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 site/check-components.py
