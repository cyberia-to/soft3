[package]
name = "soft3"
version = "0.10.0"
edition = "2021"
description = "soft3 — type 2 civilization software stack: network + real cybergraph node + CLI"
license-file = "LICENSE"
repository = "https://github.com/cyberia-to/soft3"
homepage = "https://soft3.org"
readme = "README.md"
keywords = ["soft3", "cyber", "cybergraph", "spacepussy-test"]
categories = ["command-line-utilities", "science"]
rust-version = "1.85"

[lib]
name = "soft3"
path = "src/lib.rs"

[[bin]]
name = "soft3"
path = "src/bin/soft3.rs"

[workspace]

[features]
default = []
# full stack re-exports (heavy)
stack = ["dep:cyb"]
# nonce inside bbg's NeuronRecord (DIMENSION_VERSION 3). Off until the bbg
# PR carrying the field lands; on, the chain keeps nonces under state_root
# as specs/chain.md §3.2 requires and the chain conformance snapshot moves.
bbg-nonce = []
# chain-conformance.md sections 1-9: vectors as tests (`cargo test --features chain-conformance`)
chain-conformance = []

[dependencies]
# real node engine
cybergraph = { version = "0.1.1", path = "../../cybergraph", features = ["local-storage"] }
foculus = { version = "0.1.1", path = "../../foculus", default-features = false }
hemera = { package = "cyber-hemera", version = "0.3", path = "../../hemera/rs" }
# genesis pipeline: snapshot → manifest → bbg state root (specs/genesis.md)
bbg = { version = "0.3", path = "../../bbg/rs" }
mudra = { package = "cyber-mudra", version = "0.1.0", path = "../../mudra", default-features = false }
sha2 = "0.10"
bech32 = "0.11"
base64 = "0.22"
flate2 = "1"
tade = { version = "0.1", path = "../../tade/impl/rust" }
# chain store (specs/chain.md §3.6): headers, bodies, undo journals
fjall = { version = "2", path = "../../bbg/rs/vendor/fjall" }
# optional facade
cyb = { version = "0.2.1", optional = true }
# probe + http client for sync
ureq = { version = "2", default-features = false, features = ["tls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# the known-answer key of chain-conformance §6 is BIP-39 derived
mudra = { package = "cyber-mudra", version = "0.1.0", path = "../../mudra", features = ["bridge"] }
