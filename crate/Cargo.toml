[package]
name = "soft3"
version = "0.5.0"
edition = "2021"
description = "soft3 — type 2 civilization software stack (lib facade + CLI)"
license-file = "LICENSE"
repository = "https://github.com/cyberia-to/soft3"
homepage = "https://soft3.org"
readme = "README.md"
keywords = ["soft3", "cyber", "proof", "knowledge"]
categories = ["command-line-utilities", "science"]

[lib]
name = "soft3"
path = "src/lib.rs"

[[bin]]
name = "soft3"
path = "src/bin/soft3.rs"

[workspace]

[dependencies]
cyb = { version = "0.2.1" }
foculus = { version = "0.1.1", default-features = false }
cybergraph = { version = "0.1.1" }
ureq = { version = "2", default-features = false, features = ["tls"] }
serde_json = "1"
