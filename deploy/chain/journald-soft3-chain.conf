# /etc/systemd/journald.conf.d/soft3-chain.conf
# The node logs to journald. cyberproxy's journal was 240 MB with defaults; cap it so a chatty
# node (one line per request, as 0.10.0 did under the 2026-10-15 convoy) cannot fill the 18 GB left on /.
# Per-unit rate limits are set in soft3-chain@.service (LogRateLimit*).
# Apply: sudo systemctl restart systemd-journald
[Journal]
SystemMaxUse=1G
SystemKeepFree=4G
MaxRetentionSec=30day
Compress=yes
