# spacepussy-test product RPC — soft3 chaosnet
# DNS: rpc.spacepussy-test.soft3.org → cyberproxy (167.235.28.94)
# Also serves bare Host/IP on :80 for bootstrap before TLS.

upstream spacepussy_test_rpc {
    server 127.0.0.1:7780;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name rpc.spacepussy-test.soft3.org;

    location /.well-known {
        root /var/www/html/;
    }

    location / {
        proxy_pass http://spacepussy_test_rpc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
