# soft3 component registry — the one list every surface is checked against.
# name = the word used everywhere; kind = crate | product | network | ops; layer = the rung on soft3.org/layers — eight products, one per rung: 1 nox (machine) · 2 trident (weapon) · 3 joy (warrior) · 4 neuron (agent) · 5 soft3 (network) · 6 neural (language) · 7 cyb (browser) · 8 cyber (supernet); role = the product's name in the cyberverse; part_of = the one product a component composes; machinery = a backend or host, drawn outlined; infrastructure = ops drawn the same way; phase says what ships when;
# facet = the cybics triad the home architecture groups by; phase = 1 | after | grown (grown on soft3, not of it); state = as in status.md.
# checked by site/check-components.py; edit here first, then the surfaces.

