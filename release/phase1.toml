# Phase-1 sibling-pin manifest for the weekly release train.
# Format and scope: ../specs/release-phase1-manifest.md
# Rules: cyberia/dev.md, release train section; cyber/launch.md row 39.
#
# Each [[sibling]] pins the git revision of a component's default branch
# that cyb, cyber and soft3 close over when a candidate is cut. A sibling
# whose checked-out origin/<branch> HEAD diverges from its pin is a red
# gate; the fix is a bump pull request, never a path edit in a working
# tree. Does not pin cyb, cyber or soft3 themselves — see the spec.

