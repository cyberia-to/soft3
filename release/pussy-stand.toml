# and decides nothing (release/director/plan.md D13, row P1).
#
# This file is not release/phase1.toml. phase1.toml pins default branches for
# a candidate. This file pins a rehearsal stand: every rev is a full commit
# that a `cut=false` rehearsal takes as `override` (release-train.yml input,
# `<name>=<rev>`, space-separated; render it with
# `python3 release/pussy_stand.py`). A candidate (`cut=true`) refuses
# overrides, so this file can never become a release by itself.
#
# Qualified by rehearsal 40688607756 (2026-10-28, stack leg job 122817510646,
# overrides in its receipt/sources.json), and again by rehearsal 41192673416
# (2026-10-31, all five legs, stack leg job 124512521956) with soft3 at
# bce863b (P2, soft3#479): no red beyond phase1-pins, release-notes-source,
# stack-zheng, stack-mudra, stack-neuron, the same set as 40688607756.
# `from` names the ref each rev was taken from. Where a landing PR is open
# (hemera#25, lens#36, nox#43,
# radio#52, soft3#376) the rev is that PR's head, i.e. what reaches the
# default branch if the owner approves. The landing heads of lens and radio
# are ahead of the qualified commit by documentation only; soft3's rev is
# ahead by one build profile:
#   lens  fee68d8..d6dcc3f  AGENTS.md
#   radio 9c498b2..b74133c  docs/explanation/cybernet.md, roadmap/soft3-radio.md
#   soft3 bce863b..b6f22dc  crate/Cargo.toml (soft3#484, P2a: release
#         overflow-checks for soft3 and cyber-tru), plan.md, the day's report.
#         The profile is gated by 41194300832 and diagnostic 41192950342
#         (release tests with the flag, Linux x86_64), not yet by all legs.
# Every other rev is the exact qualified commit.

