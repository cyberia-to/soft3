<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>soft3 — the loop</title>
        <meta name="description" content="the loop: compute · make · prove · remember · learn · link · focus — the seven colours of the flag, in order. one field computes, a thought is made into a program, every run leaves a proof, the book remembers what anyone ever proved, the weighted graph compiles into a model, a mind links, the network settles into one focus and pays whoever moved it." />
        <meta name="theme-color" content="#08140c" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='24' font-size='22'>🍄</text></svg>" />
        <link rel="stylesheet" href="/base.css?v=16" />
        <style id="page-style">
            .loop-stage { display: grid; grid-template-rows: minmax(0, 1fr); min-height: 0; }
            .board { padding: 0.4rem; min-height: 0; display: flex; align-items: center; justify-content: center; background: rgba(6, 16, 10, 0.72); }
            #stage { width: 100%; height: 100%; max-height: calc(100vh - 5.6rem); display: block; }
            text { font-family: Play, system-ui, sans-serif; }
            .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
            .verb { cursor: pointer; }
            .line { padding: 0.7rem 1.2rem; text-align: center; font-size: clamp(0.9rem, 1.4vw, 1.1rem); line-height: 1.45; color: rgba(255,248,240,0.85); }
            .line b { color: var(--cream); }
            .line a { color: #7dffc4; text-decoration: none; } .line a:hover { text-decoration: underline; }
            @media (max-width: 900px), (max-height: 560px) { #stage { max-height: none; } }
        </style>
    </head>
    <body>
        <canvas id="world" aria-hidden="true"></canvas>
        <div id="tint" aria-hidden="true"></div>
        <div class="shell">
            <header class="top">
                <a class="logo" href="/">soft3<span class="xbadge">experimental</span></a>
                <nav class="nav-links">
                    <a href="/chart/">chart</a>
                    <a href="/loop/">loop</a>
                    <a href="https://cyber.page/soft3/" target="_blank" rel="noopener">docs ↗</a>
                    <a href="https://github.com/cyberia-to/soft3" target="_blank" rel="noopener">github ↗</a>
                </nav>
            </header>
            <main class="loop-stage">
                <section class="board glass"><svg id="stage" viewBox="0 0 1400 1120" preserveAspectRatio="xMidYMid meet" aria-label="the loop: compute, make, prove, remember, learn, link, focus"></svg></section>
            </main>
            <footer class="foot">
                <span>don't trust. don't fear. don't beg.</span>
            </footer>
        </div>
        <script src="/world.js?v=14"></script>
        <script src="/nav.js?v=3" defer></script>
        <script>
          try {
            // ── the loop: seven verbs, the seven colours of the flag, in order ──────────
            //   one verb per product, each wearing the product's colour from the chart and linking there.
            //   COMPUTE   form   nox         the rules: one field, one hash
            //   MAKE      mass   trident     what it is made of: programs, cost known before they run
            //   PROVE     space  joy         where it happens: every run leaves a proof and is stored
            //   REMEMBER  life   cybergraph  what lives: the book answers what anyone ever proved
            //   LEARN     word   neural      what it means: the weighted graph compiles into a model
            //   LINK      work   cy          who does the work: a mind links
            //   FOCUS     play   soft3       how we coordinate: one focus, and whoever moved it is paid
            const VERBS = [
                { id: "compute",  c: "#00ff00", h: 120, who: "the machine", does: "every thought is a computation over one field", sel: "nox",        parts: ["nox", "strata", "hemera"] },
                { id: "make",     c: "#0000ff", ink: "#8080ff", h: 240, who: "the weapon",  does: "a thought is made into a program — its cost known before it runs", sel: "trident",    parts: ["trident"] },
                { id: "prove",    c: "#4000ff", ink: "#9a80ff", h: 255, who: "the warrior", does: "every run leaves a proof, and the proof is stored wherever it ran",  sel: "joy",        parts: ["joy", "zheng", "bbg"] },
                { id: "remember", c: "#8000ff", h: 270, who: "the book",    does: "what anyone ever proved, the book answers — never recomputed",        sel: "cybergraph", parts: ["cybergraph", "inf"] },
                { id: "learn",    c: "#ff0000", h: 0,   who: "the model",   does: "the weighted graph compiles into a model",                            sel: "neural",     parts: ["neural"] },
                { id: "link",     c: "#ff8000", h: 30,  who: "a mind",      does: "a thought becomes a link, with weight",                              sel: "cy",         parts: ["cy"] },
                { id: "focus",    c: "#ffff00", h: 60,  who: "the network", does: "the whole graph settles into one focus — and pays whoever moved it",  sel: "soft3",      parts: ["soft3", "foculus", "tru", "solong"] },
            ];
            const ARCS = [
                ["compute", "make", "one machine, one language"],
                ["make", "prove", "every program runs once"],
                ["prove", "remember", "every proof is kept"],
                ["remember", "learn", "the book is the training set"],
                ["learn", "link", "the model's next thought"],
                ["link", "focus", "every link has weight"],
                ["focus", "compute", "the focus runs next"],
            ];
            const CX = 700, CY = 552, R = 360, VR = 88, N = VERBS.length;
            const ang = {}; VERBS.forEach((v, i) => { ang[v.id] = -Math.PI / 2 + (i * 2 * Math.PI) / N; });
            const P = (a, r = R) => ({ x: CX + r * Math.cos(a), y: CY + r * Math.sin(a) });
            // a sentence wraps to lines of at most `w` characters, breaking at spaces
            const wrap = (text, w) => { const out = []; let line = ""; for (const word of text.split(" ")) { if ((line + " " + word).trim().length > w && line) { out.push(line); line = word; } else line = (line + " " + word).trim(); } if (line) out.push(line); return out; };

            const svg = document.getElementById("stage"), NS = "http://www.w3.org/2000/svg";
            const el = (t, at, parent) => { const e = document.createElementNS(NS, t); for (const k in at) e.setAttribute(k, at[k]); (parent || svg).appendChild(e); return e; };
            const defs = el("defs", {});
            VERBS.forEach((v) => { const m = el("marker", { id: "arr-" + v.id, viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 26, markerHeight: 26, markerUnits: "userSpaceOnUse", orient: "auto" }, defs); el("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: v.c }, m); });
            { const rg = el("radialGradient", { id: "heart", cx: "50%", cy: "50%", r: "50%" }, defs); el("stop", { offset: "0%", "stop-color": "#7dffc4", "stop-opacity": 0.16 }, rg); el("stop", { offset: "100%", "stop-color": "#7dffc4", "stop-opacity": 0 }, rg); }

            // the ring: six coloured arcs, each the verb's colour, arrowed into the next; labels ride outside the ring
            const arcLayer = el("g", {}), verbLayer = el("g", {});
            el("circle", { cx: CX, cy: CY, r: 240, fill: "url(#heart)" }, arcLayer);
            const gap = Math.asin((VR + 10) / R);
            ARCS.forEach(([a, b, label]) => {
                const va = VERBS.find((v) => v.id === a);
                let a0 = ang[a] + gap, a1 = ang[b] - gap; if (a1 < a0) a1 += 2 * Math.PI; // leave the verb circles clear, always go clockwise
                const p0 = P(a0), p1 = P(a1);
                el("path", { d: `M ${p0.x} ${p0.y} A ${R} ${R} 0 0 1 ${p1.x} ${p1.y}`, fill: "none", stroke: va.c, "stroke-opacity": 0.85, "stroke-width": 9, "stroke-linecap": "round", "marker-end": `url(#arr-${a})` }, arcLayer);
                // near the top and bottom verbs the label steps further out, past the verb's sentence
                const am = (a0 + a1) / 2, sn = Math.sin(am), mid = P(am, sn > 0.85 ? R - 150 : Math.abs(sn) > 0.8 ? R + 118 : sn > 0.4 ? R + 110 : R + 72);
                const t = el("text", { x: mid.x, y: mid.y + 6, "text-anchor": "middle", fill: "rgba(255,248,240,0.85)", "font-size": 18, "paint-order": "stroke", stroke: "#06100a", "stroke-width": 8 }, arcLayer);
                t.textContent = label;
            });
            // the heart
            el("text", { x: CX, y: CY - 6, "text-anchor": "middle", fill: "#7dffc4", "font-size": 50, "font-weight": 700, "letter-spacing": 6 }).textContent = "the loop";
            el("text", { x: CX, y: CY + 34, "text-anchor": "middle", fill: "rgba(255,248,240,0.7)", "font-size": 19, class: "mono" }).textContent = "one graph · one proof · one mind";

            // the verbs: the circle names the verb and who does it; the sentence and its parts sit beside the circle
            const verbEls = {};
            VERBS.forEach((v) => {
                const a = ang[v.id], p = P(a);
                const g = el("g", { class: "verb", "data-id": v.id }, verbLayer);
                el("circle", { cx: p.x, cy: p.y, r: VR, fill: "#06100a", "fill-opacity": 0.85 }, g);
                el("circle", { cx: p.x, cy: p.y, r: VR, fill: v.c, "fill-opacity": 0.22, stroke: v.c, "stroke-width": 3 }, g);
                const fs = v.id.length > 6 ? 23 : v.id.length > 5 ? 32 : 38, ink = v.ink || v.c;
                el("text", { x: p.x, y: p.y - 6, "text-anchor": "middle", fill: ink, "font-size": fs, "font-weight": 700, "letter-spacing": v.id.length > 6 ? 1 : 3 }, g).textContent = v.id.toUpperCase();
                el("text", { x: p.x, y: p.y + 26, "text-anchor": "middle", fill: "rgba(255,248,240,0.9)", "font-size": 17 }, g).textContent = v.who;
                // the block: sentence lines, then the parts line — above the top verb, beside the side verbs, below the bottom one
                const c = Math.cos(a), sn = Math.sin(a), lines = wrap(v.does, sn < -0.9 ? 26 : sn > 0.85 ? 20 : 22), LH = 26, block = lines.length * LH + 24;
                let x = p.x, y0, anchor = "middle";
                if (sn < -0.9) { y0 = p.y - VR - 22 - block + LH; }
                else if (sn > 0.85) { y0 = p.y + VR + 36; }
                else { anchor = c > 0 ? "start" : "end"; x = p.x + (c > 0 ? 1 : -1) * (VR + 24); y0 = p.y - block / 2 + LH; }
                const s = el("text", { x, y: y0, "text-anchor": anchor, fill: "rgba(255,248,240,0.92)", "font-size": 21, "paint-order": "stroke", stroke: "#06100a", "stroke-width": 8 }, g);
                lines.forEach((ln, i) => { const ts = el("tspan", { x, dy: i ? LH : 0 }, s); ts.textContent = ln; });
                el("text", { x, y: y0 + (lines.length - 1) * LH + 24, "text-anchor": anchor, fill: ink, "font-size": 15, class: "mono", "paint-order": "stroke", stroke: "#06100a", "stroke-width": 6 }, g).textContent = v.parts.join(" · ");
                verbEls[v.id] = g;
            });

            // the page takes the verb's colour while you point at it
            function tint(v) { const full = !v; document.documentElement.style.setProperty("--facet", full ? "#fff8f0" : v.c); document.documentElement.style.setProperty("--accent-h", full ? 150 : v.h); document.documentElement.style.setProperty("--tint", full ? 0 : 0.72); if (window.worldHue) worldHue(full ? 0 : v.h - 150); }
            VERBS.forEach((v) => { const g = verbEls[v.id]; g.addEventListener("mouseenter", () => tint(v)); g.addEventListener("mouseleave", () => tint(null)); g.addEventListener("click", () => { (window.soft3Go || ((h) => { location.href = h; }))("/chart/?sel=" + v.sel); }); });
            tint(null);
          } catch (err) {
            const b = document.querySelector(".board"); if (b) { b.innerHTML = "<p style=\"padding:1rem;font-family:monospace;color:#ffb0b0\">loop failed: " + (err && err.message) + "</p>"; }
            throw err;
          }
        </script>

        <!-- lytics: anonymous, signed, PoW-gated pageview + attention tracking. -->
