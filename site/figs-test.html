<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>figs-live — loop · chart · ladder over the world</title>
<link rel="stylesheet" href="/deck.css">
<style>
  /* deck.css locks the body to one screen; this page scrolls */
  html, body { height: auto; overflow: auto; background: #06100a; }
  #world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  #tint { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: var(--facet, #7dffc4); mix-blend-mode: color; opacity: var(--tint, 0); transition: background .5s ease, opacity .5s ease; }
  main { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 1.5vw; padding: 2vh 1.5vw 20vh; align-items: start; }
  main > section { background: rgba(6,16,10,.72); backdrop-filter: blur(14px); border: 1px solid rgba(255,248,240,.12); border-radius: 14px; padding: .9rem 1rem; min-width: 0; }
  main h1 { font: 700 12px/1 Play, system-ui, sans-serif; letter-spacing: .25em; text-transform: uppercase; color: #7dffc4; margin: 0 0 .6rem; }
  #loop svg, #chart svg { width: 100%; height: auto; display: block; }
  #log { position: fixed; left: 1.5vw; bottom: 1vh; z-index: 2; margin: 0; width: 40vw; max-height: 15vh; overflow: auto; font: 12px/1.4 "JetBrains Mono", ui-monospace, monospace; color: #fff8f0; background: rgba(6,16,10,.88); border: 1px solid rgba(125,255,196,.3); border-radius: 8px; padding: .5rem .8rem; white-space: pre-wrap; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } #log { width: calc(100vw - 3vw); } }
</style>
</head>
<body>
<canvas id="world" aria-hidden="true"></canvas>
<div id="tint" aria-hidden="true"></div>
<main>
  <section><h1>loop</h1><div id="loop"></div></section>
  <section><h1>chart</h1><div id="chart"></div></section>
  <section><h1>ladder</h1><div id="ladder"></div></section>
</main>
<pre id="log">events:</pre>
<script src="/data.js"></script>
<script src="/features.js"></script>
<script src="/loop-fig.js"></script>
<script src="/chart-fig.js"></script>
<script src="/ladder-fig.js"></script>
<script src="/figs-live.js"></script>
<script src="/world.js"></script>
<script>
(() => {
  // wrapped: features.js and world.js own bare top-level names (n, d, t, screen, …)
  const logEl = document.getElementById("log");
  const log = (s) => { logEl.textContent += "\n" + s; logEl.scrollTop = 1e9; };
  const root = document.documentElement;
  // the pages' tint(): facet hue → #tint wash + worldHue offset (the scene is green ~150 by nature)
  const tint = (h, c) => {
    const full = h == null;
    root.style.setProperty("--facet", full ? "#fff8f0" : c || `hsl(${h} 100% 50%)`);
    root.style.setProperty("--tint", full ? 0 : 0.5);
    if (window.worldHue) worldHue(full ? 0 : h - 150);
  };
  const onHover = (h) => tint(h);
  const live = {};
  live.loop = liveFigs.loop(document.getElementById("loop"), {
    current: "compute", onHover,
    onVerb: (id, v) => { log("onVerb " + id); live.chart.focus(v.sel); live.ladder.select(v.sel); },
  });
  live.chart = liveFigs.chart(document.getElementById("chart"), {
    focus: null, onHover,
    onHub: (id) => { log("onHub " + id); live.ladder.select(id); },
  });
  live.ladder = liveFigs.ladder(document.getElementById("ladder"), {
    selected: "nox", onHover,
    onRung: (id) => { log("onRung " + id); live.chart.focus(id); },
  });
  window.live = live; window.log = log;
})();
</script>
</body>
</html>
